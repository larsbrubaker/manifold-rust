name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # clipper2-rust is a `{ version, path }` dependency on ../clipper2-rust
      # (see Cargo.toml), so cargo cannot load the workspace without the
      # sibling checkout next to this one. actions/checkout only writes inside
      # the workspace directory, hence a plain clone into its parent.
      - name: Checkout clipper2-rust next to manifold-rust
        run: git clone --depth 1 https://github.com/larsbrubaker/clipper2-rust.git ../clipper2-rust

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build demo/wasm --target web --out-dir ../public/pkg --no-typescript

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install demo dependencies
        run: cd demo && bun install --frozen-lockfile

      - name: Build static site
        run: cd demo && bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
