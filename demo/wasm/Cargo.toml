[package]
name = "manifold-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the Manifold Rust 3D geometry library"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
manifold-rust = { path = "../.." }
wasm-bindgen = "0.2"
js-sys = "0.3"
# Routes Rust panic messages (with location) to console.error — without it a
# panic surfaces only as an opaque "RuntimeError: unreachable".
console_error_panic_hook = "0.1"
